<div class="lang">
  <button type="button" class="lang-btn" aria-haspopup="true" aria-expanded="false" data-i18n-attr="aria-label:lang.choose" aria-label="Elegir idioma">
    <svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg>
    <span class="lang-current" data-i18n="lang.name">Español</span>
    <svg class="ic ic-sm" aria-hidden="true"><use href="#i-chevron"/></svg>
  </button>
  <ul class="lang-menu" role="menu" hidden>
    <li role="none"><button type="button" role="menuitemradio" data-lang="es" lang="es"><span class="lang-code">ES</span>Español<svg class="ic lang-check" aria-hidden="true"><use href="#i-check"/></svg></button></li>
    <li role="none"><button type="button" role="menuitemradio" data-lang="en" lang="en"><span class="lang-code">EN</span>English<svg class="ic lang-check" aria-hidden="true"><use href="#i-check"/></svg></button></li>
    <li role="none"><button type="button" role="menuitemradio" data-lang="pt" lang="pt"><span class="lang-code">PT</span>Português<svg class="ic lang-check" aria-hidden="true"><use href="#i-check"/></svg></button></li>
    <li role="none"><button type="button" role="menuitemradio" data-lang="zh" lang="zh-Hans"><span class="lang-code">ZH</span>中文（简体）<svg class="ic lang-check" aria-hidden="true"><use href="#i-check"/></svg></button></li>
    <li role="none"><button type="button" role="menuitemradio" data-lang="fr" lang="fr"><span class="lang-code">FR</span>Français<svg class="ic lang-check" aria-hidden="true"><use href="#i-check"/></svg></button></li>
    <li role="none"><button type="button" role="menuitemradio" data-lang="ja" lang="ja"><span class="lang-code">JA</span>日本語<svg class="ic lang-check" aria-hidden="true"><use href="#i-check"/></svg></button></li>
  </ul>
</div>
